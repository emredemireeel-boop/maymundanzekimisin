name: zihin_tuzaklari
description: "Maymundan Zeki Misin? – Strateji ve Mantık Yarışması"
publish_to: 'none'
version: 1.0.8+8

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.4
  confetti: ^0.8.0
  audioplayers: ^6.1.0
  google_mobile_ads: ^5.3.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#1A1A2E"
  adaptive_icon_foreground: "assets/logo.png"
  remove_alpha_ios: true

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/

