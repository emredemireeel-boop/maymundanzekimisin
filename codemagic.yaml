workflows:
  ios_app_store:
    name: Maymundan Zeki Misin? iOS App Store
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: YKS Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.zihintuzaklari.zihinTuzaklari
      flutter: 3.38.5
      xcode: 26.6
      cocoapods: default
    scripts:
      - name: Flutter paketlerini hazırla
        script: flutter pub get
      - name: Kod kalitesini denetle
        script: flutter analyze --no-pub
      - name: Testleri çalıştır
        script: flutter test --no-pub
      - name: iOS imzalama profilini uygula
        script: xcode-project use-profiles
      - name: App Store IPA dosyasını oluştur
        script: |
          flutter build ipa --release \
            --build-name=1.0.15 \
            --build-number=15 \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
